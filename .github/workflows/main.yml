name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'LAN Scanner release'

jobs:
  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 签名方式与原始 workflow 完全一致：secrets -> release.jks + key.properties
      # 路径由原 android/ 子目录变为工程根目录（android/app/release.jks -> app/release.jks）
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          cat > key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      # arm64 由 app/build.gradle.kts 的 splits.abi include("arm64-v8a") 保证
      # （对应原工程 --target-platform android-arm64）
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" 2>/dev/null | sort

          APK=$(find . -name "*.apk" 2>/dev/null | grep -i "release" | grep -v debug | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | grep -v debug | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "=== No APK found ==="
            exit 1
          fi

          echo "Found: $APK ($(du -sh $APK | cut -f1))"
          mkdir -p output
          cp "$APK" output/lan_scanner-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/lan_scanner-arm64.apk
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - name: Create Git tag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${{ github.event.inputs.tag }}`,
              sha: context.sha
            })

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: LAN Scanner ${{ github.event.inputs.tag }}
          body: |
            ## LAN Scanner ${{ github.event.inputs.tag }}

            ${{ github.event.inputs.release_notes }}

            | 文件 | 说明 |
            |------|------|
            | `lan_scanner-arm64.apk` | Android arm64 正式签名版（Kotlin Compose） |
          files: |
            artifacts/lan_scanner-arm64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
